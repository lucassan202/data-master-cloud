name: 'Databricks Terraform CI/CD'

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      aws-assume-role-arn:
        type: string
        default: "arn:aws:iam::120945137272:role/github-actions-data-master"
      aws-region:
        type: string
        default: "us-east-2"
      aws-statefile-s3-bucket:
        type: string
        default: "data-master-us-east-2-terraform-statefile"
      aws-lock-dynamodb-table:
        type: string
        default: "data-master-us-east-2-terraform-lock"
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_CLIENT_ID:
        required: true
      DATABRICKS_CLIENT_SECRET:
        required: true  
      TF_STATE_BUCKET:
        required: false
      TF_LOCK_TABLE:
        required: false
      AIRFLOW_ADMIN_USERNAME:
        required: false
      AIRFLOW_ADMIN_PASSWORD:
        required: false
      AIRFLOW_ADMIN_EMAIL:
        required: false
      AIRFLOW__SMTP__SMTP_HOST:
        required: false
      AIRFLOW__SMTP__SMTP_PORT:
        required: false
      AIRFLOW__SMTP__SMTP_USER:
        required: false
      AIRFLOW__SMTP__SMTP_PASSWORD:
        required: false
      AIRFLOW__SMTP__SMTP_MAIL_FROM:
        required: false
      AIRFLOW__SMTP__SMTP_STARTTLS:
        required: false
      AIRFLOW__SMTP__SMTP_SSL:
        required: false
      AIRFLOW_NOTIFICATION_EMAILS:
        required: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:      
      ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ inputs.aws-region }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || inputs.aws-statefile-s3-bucket }}
      TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE || inputs.aws-lock-dynamodb-table }}
      S3_BUCKET: ${{ inputs.environment }}-${{ inputs.aws-region }}-data-master
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID  }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET  }}
      TF_VAR_airflow_admin_username: ${{ secrets.AIRFLOW_ADMIN_USERNAME }}
      TF_VAR_airflow_admin_password: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
      TF_VAR_airflow_admin_email: ${{ secrets.AIRFLOW_ADMIN_EMAIL }}
      TF_VAR_airflow_smtp_host: ${{ secrets.AIRFLOW__SMTP__SMTP_HOST }}
      TF_VAR_airflow_smtp_port: ${{ secrets.AIRFLOW__SMTP__SMTP_PORT }}
      TF_VAR_airflow_smtp_user: ${{ secrets.AIRFLOW__SMTP__SMTP_USER }}
      TF_VAR_airflow_smtp_password: ${{ secrets.AIRFLOW__SMTP__SMTP_PASSWORD }}
      TF_VAR_airflow_smtp_mail_from: ${{ secrets.AIRFLOW__SMTP__SMTP_MAIL_FROM }}
      TF_VAR_airflow_smtp_starttls: ${{ secrets.AIRFLOW__SMTP__SMTP_STARTTLS }}
      TF_VAR_airflow_smtp_ssl: ${{ secrets.AIRFLOW__SMTP__SMTP_SSL }}
      TF_VAR_airflow_notification_emails: ${{ secrets.AIRFLOW_NOTIFICATION_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read destroy configuration
        id: read-destroy-config
        run: |
          DESTROY="$(jq -r '.${{ inputs.environment }}' ./IaC/destroy_config.json)"
          echo "destroy=$(echo $DESTROY)" >> $GITHUB_OUTPUT     
          
      - name: Setup Python
        if: steps.read-destroy-config.outputs.destroy != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda Package Screp Download CSV
        if: steps.read-destroy-config.outputs.destroy != 'true'        
        run: make build-csv

      - name: Build Lambda Package Screp Selenium   
        if: steps.read-destroy-config.outputs.destroy != 'true'     
        run: make build-screp      

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.3

      - name: Install Databricks CLI
        if: steps.read-destroy-config.outputs.destroy != 'true'
        uses: databricks/setup-cli@main

      - name: Configure AWS credentials        
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-assume-role-arn }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ inputs.aws-region }}

      - name: Initialize and apply bucket Terraform state
        if: steps.read-destroy-config.outputs.destroy != 'true'
        run: |
          cd IaC/buckets
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=data-master-cloud-buckets" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"
          terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"
          terraform apply -auto-approve \
            -var="env=$ENVIRONMENT" \
            -var="aws_region=$AWS_REGION"

      - name: Upload Lambda to S3
        if: steps.read-destroy-config.outputs.destroy != 'true'
        run: |
          aws s3 cp lambda_function.zip "s3://$S3_BUCKET/tmp/lambda_function.zip" --region "$AWS_REGION"
          aws s3 cp selenium_layer.zip "s3://$S3_BUCKET/tmp/selenium_layer.zip" --region "$AWS_REGION"

      - name: Terraform Init Application State
        run: |
          cd IaC && terraform init \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=data-master-cloud" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"
      
      - name: Terraform Validate
        run: terraform -chdir=IaC validate

      - name: Adopt existing Lambda log group
        if: steps.read-destroy-config.outputs.destroy != 'true'
        run: |
          cd IaC
          terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"

          LOG_GROUP_NAME="/aws/lambda/download-csv-consumer-${ENVIRONMENT}"

          # Lambda may have created the group before Terraform managed it.
          if ! terraform state show aws_cloudwatch_log_group.lambda_download >/dev/null 2>&1 \
            && aws logs describe-log-groups \
              --log-group-name-prefix "$LOG_GROUP_NAME" \
              --query "logGroups[?logGroupName=='${LOG_GROUP_NAME}'].logGroupName | [0]" \
              --output text | grep -Fxq "$LOG_GROUP_NAME"; then
            terraform import -input=false \
              aws_cloudwatch_log_group.lambda_download "$LOG_GROUP_NAME"
          fi

      - name: Terraform Destroy
        if: steps.read-destroy-config.outputs.destroy == 'true'
        id: terraform-destroy
        run: |
          cd IaC
          terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"
          terraform destroy -auto-approve \
            -var="env=$ENVIRONMENT" \
            -var="environment=$ENVIRONMENT"
      
      - name: Terraform Plan
        if: steps.read-destroy-config.outputs.destroy != 'true'
        id: terraform-plan
        run: |
          cd IaC
          terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"
          terraform plan \
            -var="env=$ENVIRONMENT" \
            -var="environment=$ENVIRONMENT" \
            -out="$ENVIRONMENT.plan"

      - name: Terraform Apply
        if: steps.read-destroy-config.outputs.destroy != 'true'
        id: terraform-apply      
        run: |
          cd IaC
          terraform workspace select "$ENVIRONMENT" || terraform workspace new "$ENVIRONMENT"
          terraform apply "$ENVIRONMENT.plan"
